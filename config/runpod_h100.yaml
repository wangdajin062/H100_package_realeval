# RunPod Single-Card H100 SXM 80GB · 8 vCPU · 125GB RAM · PyTorch 2.8 Override Profile
# Usage: Use REALEVAL_ environment variables or merge in runner; key is to tune scale for single 80GB card stability.
profile: runpod_1xH100_80GB
hardware:
  gpus: 1
  vram_gb: 80
  vcpu: 8
  ram_gb: 125
runtime:
  bf16: true
  tf32: true
  torch_compile: false   # 关闭：compile 在 H100 首次编译极慢且与 LoRA adapter 不兼容（见 realeval/models.py）
  flash_attention: true
  quantization: nvfp4         # NBE QAT (QDQ fake-quant)，与 config/experiments.yaml training.quantize 对齐
  omp_threads: 8              # = vCPU, single card no sharing
paper_run:
  distill_steps: 2000
  eval_samples: 2851          # TAF-28k BC test set
  spec_samples: 500
  latency_iters: 100
  batch_size: 64              # 0.5B@BF16 on 80GB can go larger; conservative 64 for stability
reproducibility:
  exp2_seeds: 5               # exp2 损失消融多 seed 数（论文声称 5，见 rerun_checklist Tab.5）
  exp1_seeds: 5               # 路径 B：exp1 QAD 蒸馏多 seed（产出真实 std）
  exp3_seeds: 5               # 路径 B：exp3 OV-Freeze 各条件多 seed
  exp11_seeds: 5              # 路径 B：exp11 各量化方案多 seed
  exp14_seeds: 5              # 路径 B：exp14 各运行时多 seed
  exp10_seeds: 5              # 路径 B：exp10 教师规模多 seed
data:
  source: taf28k             # 数据来源标记：仅 provenance 记录与白名单校验消费（realeval/validation.py）
  dataset: taf28k            # 覆盖基础配置的 chifraud：pod 上主判别语料强制为 TAF-28k（实验读取 data.dataset）
  root_hint: /workspace/data # RunPod persistent volume
models:
  root_hint: /workspace/models
