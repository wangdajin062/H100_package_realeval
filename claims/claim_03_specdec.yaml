id: CLAIM-03
hypothesis: "Speculative decoding with the measured acceptance rate yields >2x formula-derived token speedup (Leviathan Eq.1)."
experiment: exp6
evidence_path: [diagnostic_B, h100_measured]
independent_variable: draft_model
dependent_variable: speedup   # formula-derived token speedup (1-alpha^(g+1))/(1-alpha), NOT wall-clock measured
control: [gamma, dataset]
acceptance:
  - "speedup > 2.0"
  - "measured_alpha is not None"   # UNSUPPORTED if nothing was measured (sandbox)
seeds: 5   # paper 5-seed protocol (was 1; audit P1-15)
threshold_origin:
  speedup:
    value: 2.0
    source: "paper_hypothesis"  # from v25 manuscript claim of >2x token speedup via speculative decoding
    note: "Formula-derived token speedup from the measured acceptance rate via Leviathan et al. 2023 Eq.1 — NOT a wall-clock measurement. The paper's wall-clock speedups (Fig7/Table 8: 2.78x->3.32x SD8G3) are paper_reference.speculative_speedups, which require a separate hardware benchmark not covered by this codebase (audit P1-15). This claim verifies the measured-alpha -> speedup inference, not the hardware wall-clock figure."

